# Cargo.toml

[package]
name = "database-monitor"
version = "0.1.4"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Zero-query passive terminal monitor for outbound database connections, traffic, SQL payloads, and AI agent over-execution on Windows."
readme = "README.md"
keywords = ["database", "monitor", "tui", "mysql", "traffic"]
categories = ["command-line-utilities", "development-tools", "network-programming"]
repository = "https://github.com/jungho-dev/database-monitor"
documentation = "https://docs.rs/database-monitor"
exclude = [
  "/.cargo",
  "/.claude",
  "/.cmd",
  "/.docs",
  "/.github",
  "/.vscode",
  "/.gitignore",
  "/.gitignore-private",
  "/.gitignore-public",
  "/CLAUDE.md",
  "/assets/icon/*.webp",
  "/assets/icon/build_icon.py",
  "/vendor",
]

[[bin]]
name = "database-monitor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
crossbeam-channel = "0.5.15"
crossterm = "0.29.0"
pcap = "2.4.0"
ratatui = "0.30.2"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.8.23"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
